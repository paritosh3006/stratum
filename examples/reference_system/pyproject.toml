[project]
name = "stratum-reference-system"
version = "0.1.0"
description = "Hybrid RAG reference system — the thing Stratum measures"
requires-python = ">=3.10"
dependencies = ["stratum-eval"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
models = ["sentence-transformers>=3.0"]
indic = ["ai4bharat-transliteration>=1.5", "transformers>=4.40", "torch>=2.0", "huggingface-hub>=0.20", "fasttext-wheel>=0.9", "indic-transliteration>=2.3"]
all = ["pymupdf>=1.24", "sentence-transformers>=3.0", "ai4bharat-transliteration>=1.5", "transformers>=4.40", "torch>=2.0", "huggingface-hub>=0.20", "fasttext-wheel>=0.9", "indic-transliteration>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
