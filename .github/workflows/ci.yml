name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stratum-eval (dev)
        run: pip install -e ".[dev]"

      # No judge/translation/transliteration model backend is installed here
      # on purpose — the default stub/heuristic backends cover every test,
      # so CI proves the suite runs fully offline, the same guarantee a
      # contributor without model weights or network access gets locally.
      - name: Run tests
        run: pytest -q
